name: Build Mix V-Power

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --icon=icons/iconV.ico --name "Mix V-Power" bonus_calculator.py
    
    - name: Create distribution package
      run: |
        mkdir "dist/Mix V-Power"
        move "dist/Mix V-Power.exe" "dist/Mix V-Power/"
        copy "Logo_Vpower.png" "dist/Mix V-Power/"
        xcopy "icons" "dist/Mix V-Power/icons/" /E /I /Y
        copy "README.md" "dist/Mix V-Power/"
        copy "Leia-me.txt" "dist/Mix V-Power/"
        copy "dist/Mix V-Power/INSTALACAO.txt" "dist/Mix V-Power/" 2>nul || echo "INSTALACAO.txt not found, skipping"
    
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path "dist/Mix V-Power" -DestinationPath "dist/Mix-V-Power-${{ github.ref_name }}.zip"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Mix-V-Power-${{ github.ref_name }}
        path: dist/Mix-V-Power-*.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Mix-V-Power-*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}